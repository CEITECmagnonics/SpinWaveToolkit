name: Run Pytests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13']
    name: Pytest (ubuntu-latest, Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run pytest
        run: |
          pytest tests

  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9','3.10','3.11','3.12','3.13']
        # '3.7'  # is not supported by any latest OS
        # '3.8'  # has problems with project.license-files in pyproject.toml
    name: Pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run pytest
        run: |
          pytest tests

  # Test coverage: comment on PRs and badge in README (data are stored in the
  # `python-coverage-comment-action-data` branch, see CONTRIBUTING.md).
  # Runs on PRs (to any branch, e.g. `new-release`) and on pushes to the
  # default branch (`master`), where the badge and the reference coverage
  # for the PR comments are updated.
  coverage:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    name: Coverage (ubuntu-latest, Python 3.13)
    permissions:
      pull-requests: write  # to post the coverage comment
      contents: write  # to update the `python-coverage-comment-action-data` branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]  # editable, so that coverage measures the repository files
      - name: Run pytest with coverage
        run: |
          pytest tests --cov
      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
      - name: Store PR comment to be posted (PRs from forks)
        # PRs from forks cannot post comments, the comment is posted by
        # the `coverage_comment.yml` workflow instead
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
